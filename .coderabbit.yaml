# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  fail_commit_status: true
  auto_approvals:
    enabled: false
  pre_merge_checks:
    override_requested_reviewers_only: true
    title:
      mode: error
      requirements: "Title MUST begin with the exact prefix ZZZ-TICKET- followed by a numeric ticket id."
chat:
  allow_non_org_members: true
