# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Left in place for CodeRabbit triage of finding 61f3ecee.
# auto_approvals is explicitly DISABLED and chat is left at its default policy,
# which is the configuration under which an outside non-member still gets
# "@coderabbitai resolve" executed on a maintainer's pull request.
language: en-US
reviews:
  profile: chill
  auto_approvals:
    enabled: false
chat:
  allow_non_org_members: true
